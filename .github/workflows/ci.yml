name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The check main requires. One runner: one install, then nx affected runs
  # the touched projects (and their dependents) in parallel. On main it also
  # saves the pnpm store, the only cache this repo keeps.
  affected:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected compares with the base commit, so it needs the history.
          fetch-depth: 0

      # A change to documentation only (*.md, docs/) skips the checks; the job
      # still passes, since main requires it.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if files=$(git diff --name-only "$BASE" HEAD); then
            code=false
            while read -r f; do
              case "$f" in
                "" | *.md | docs/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "Code changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.code == 'true'
        id: setup
        uses: ./.github/actions/setup

      # Project references in line with the package.json dependencies (nx sync).
      - if: steps.changes.outputs.code == 'true'
        run: pnpm nx sync:check

      # Who may depend on whom (tools/boundaries.mjs): the frontend never on the backend.
      - if: steps.changes.outputs.code == 'true'
        run: pnpm boundaries

      # Sets NX_BASE / NX_HEAD: the PR's base, or main's last green commit.
      - if: steps.changes.outputs.code == 'true'
        uses: nrwl/nx-set-shas@v4

      - if: steps.changes.outputs.code == 'true'
        run: pnpm nx affected -t lint typecheck test build --outputStyle=static --parallel=4

      - if: github.event_name == 'push' && steps.changes.outputs.code == 'true' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.store-path }}
          key: ${{ steps.setup.outputs.cache-key }}

      # Keeps one store: deletes those of older lockfiles (and the old
      # setup-node "node-cache-" entries).
      - if: github.event_name == 'push' && steps.changes.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ steps.setup.outputs.cache-key }}
        run: |
          for prefix in pnpm-store- node-cache-; do
            gh cache list --key "$prefix" --limit 100 --json id,key \
              --jq ".[] | select(.key != \"$KEY\") | .id" |
              while read -r id; do
                gh cache delete "$id"
              done
          done
