name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected compares with the base commit, so it needs the history.
          fetch-depth: 0

      # Version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sets NX_BASE / NX_HEAD: the PR's base, or main's last green commit.
      - uses: nrwl/nx-set-shas@v4

      - run: pnpm nx affected -t lint typecheck test build --outputStyle=static
