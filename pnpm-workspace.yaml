packages:
  - apps/*
  - packages/*
  - packages/backend/*
  - packages/frontend/*

# Dependencies allowed to run their install scripts (pnpm skips the others).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  nx: true

# Versions shared by several projects: reference them as "catalog:".
catalog:
  "@base-ui/react": ^1.9.0
  "@better-auth/drizzle-adapter": 1.7.12
  "@nestjs/cache-manager": ^12.0.2
  "@nestjs/common": ^12.0.1
  "@nestjs/config": ^12.0.1
  "@nestjs/core": ^12.0.1
  "@nestjs/drizzle": ^0.0.2
  "@nestjs/testing": ^12.0.1
  "@nx/devkit": 24.0.4
  "@nx/eslint-plugin": 24.0.4
  "@swc/core": ^1.16.20
  "@tanstack/react-form-nextjs": ^1.33.5
  "@thallesp/nestjs-better-auth": ^2.8.0
  "@types/express": ^5.0.0
  "@types/node": ^24.0.0
  "@types/react": ^19
  "@types/react-dom": ^19
  better-auth: 1.7.12
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  eslint: ^9
  eslint-plugin-react-hooks: ^7.1.1
  lucide-react: ^1.61.0
  mysql2: ^3.24.6
  next: 16.4.3
  next-intl: ^4.14.9
  nx: 24.0.4
  oxlint: ^1.58.0
  oxlint-tsgolint: ^7.0.2001
  prettier: ^3.9.10
  react: 19.3.0
  react-dom: 19.3.0
  resend: ^6.34.1
  tsx: ^4.23.15
  typescript: ^6.0.2
  typescript-eslint: ^8.72.1
  unplugin-swc: ^2.0.0
  vitest: ^4.1.2
  zod: ^4.6.7

permissions:
  '@tanstack/react-table':
    skills: true
  drizzle-kit:
    skills: false
