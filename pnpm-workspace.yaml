packages:
  - apps/*
  - packages/*
  - packages/backend/*
  - packages/frontend/*

# Dependencies allowed to run their install scripts (pnpm skips the others).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  # bullmq's msgpackr: prebuilt binaries come as optional packages; its script only rebuilds them.
  msgpackr-extract: false
  nx: true
  # Its postinstall only checks versions: not needed.
  protobufjs: false

# Versions shared by several projects: reference them as "catalog:".
catalog:
  "@ai-sdk/anthropic": ^4.0.106
  "@ai-sdk/openai": ^4.0.121
  "@ai-sdk/openai-compatible": ^3.0.93
  "@base-ui/react": ^1.9.0
  "@casl/ability": ^7.1.3
  "@casl/react": ^7.1.0
  "@grafana/faro-web-sdk": ^2.15.0
  "@grafana/faro-web-tracing": ^2.15.0
  "@better-auth/drizzle-adapter": 1.7.12
  "@nestjs/bullmq": ^12.0.2
  "@nestjs/cache-manager": ^12.0.2
  "@nestjs/common": ^12.0.1
  "@nestjs/config": ^12.0.1
  "@nestjs/core": ^12.0.1
  "@nestjs/drizzle": ^0.0.2
  "@nestjs/platform-express": ^12.0.1
  "@nestjs/testing": ^12.0.1
  "@nx/devkit": 24.0.4
  "@nx/eslint-plugin": 24.0.4
  "@opentelemetry/api": ^1.10.0
