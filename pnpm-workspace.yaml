  "@swc/core": ^1.16.20
  "@tanstack/react-form-nextjs": ^1.33.5
  "@thallesp/nestjs-better-auth": ^2.8.0
  "@types/express": ^5.0.0
  "@types/node": ^24.0.0
  "@types/pg": ^8.23.1
  "@types/react": ^19
  "@types/react-dom": ^19
  ai: ^7.0.176
  angular-expressions: ^1.7.2
  better-auth: 1.7.12
  bullmq: ^6.7.0
  client-only: ^0.0.1
  class-variance-authority: ^0.7.1
