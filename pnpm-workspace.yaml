  - "@ai-sdk/provider-utils@5.0.82"
  - "@ai-sdk/provider@4.0.39"
  - ai@7.0.176
  - lucide-react@1.82.0

permissions:
  '@tanstack/react-table':
    skills: false
# Dafne CLAUDE.md indicates to generate migrations with 'pnpm dafne db generate'
# and to apply them with the project's migrator. Skill says to use drizzle-kit directly, push included, 
# and that might teach the assistant to overcome those rules.
  drizzle-kit:
    skills: false