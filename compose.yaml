# Development services: PostgreSQL, Redis, Gotenberg (DOCX to PDF) and the
# Grafana stack (logs, traces, metrics: docs/observability.md).
#
#   docker compose up -d      # start (data kept in named volumes): or `pnpm dafne services up`
#   docker compose --profile telemetry up -d   # with the Grafana stack: or `pnpm dafne services up --telemetry`
#   docker compose --profile telemetry down    # stop (the profile stops otel and alloy too)
#   docker compose down -v    # stop and delete the data
#
# They are reached as db.dafne.localhost, redis.dafne.localhost,
# gotenberg.dafne.localhost, otel.dafne.localhost and faro.dafne.localhost:
# *.localhost resolves to this machine by itself (no hosts file), and the
# ports are published on the loopback only, not to the network.
# DAFNE_DB_PORT / DAFNE_REDIS_PORT / DAFNE_GOTENBERG_PORT / DAFNE_GRAFANA_PORT /
# DAFNE_OTLP_PORT / DAFNE_FARO_PORT / DAFNE_ALLOY_PORT change them (e.g. next to Postgres.app).
# The Grafana stack (otel, alloy) is opt-in, the `telemetry` profile:
# without it the apps only log to the console. `pnpm dafne dev` starts them
# by itself (`--telemetry` for the Grafana stack), `pnpm dafne services up |
# down` alone; on a new server dafne dev also creates the database and migrates.
name: dafne

services:
  db:
    image: postgres:18-alpine
    environment:
      # The server's superuser: ADMIN_DATABASE_URL of packages/backend/migrator/.env.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${DAFNE_DB_PORT:-5432}:5432"
      - "[::1]:${DAFNE_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18.
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${DAFNE_REDIS_PORT:-6379}:6379"
      - "[::1]:${DAFNE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Converts the documents filled from the uploaded Word templates
  # (@dafne/backend-documents) to PDF: GOTENBERG_URL of apps/sales-api/.env.
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:${DAFNE_GOTENBERG_PORT:-3100}:3000"
      - "[::1]:${DAFNE_GOTENBERG_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Grafana, Loki (logs), Tempo (traces), Prometheus (metrics) and an
  # OpenTelemetry collector in one image, for development: Grafana at
  # http://otel.dafne.localhost:3200 (no sign-in), OTLP over HTTP at
  # http://otel.dafne.localhost:4318 (OTEL_EXPORTER_OTLP_ENDPOINT of the
  # apps). Its data is thrown away with the container.
  otel:
    image: grafana/otel-lgtm:0.41.1
    profiles: [telemetry]
    ports:
      - "127.0.0.1:${DAFNE_GRAFANA_PORT:-3200}:3000"
      - "[::1]:${DAFNE_GRAFANA_PORT:-3200}:3000"
      - "127.0.0.1:${DAFNE_OTLP_PORT:-4318}:4318"
      - "[::1]:${DAFNE_OTLP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Receives the browser's telemetry (Grafana Faro, @dafne/frontend-logger)
  # and forwards it to otel: FARO_URL of apps/sales-web/.env. Its UI (the
  # components and their health, live debugging) at
  # http://faro.dafne.localhost:12345; its own metrics go to otel's Prometheus.
  alloy:
    image: grafana/alloy:v1.22.0
    profiles: [telemetry]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      # The UI and /metrics, reachable from the host (default: the container's loopback).
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./tools/alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "127.0.0.1:${DAFNE_FARO_PORT:-12347}:12347"
      - "[::1]:${DAFNE_FARO_PORT:-12347}:12347"
      - "127.0.0.1:${DAFNE_ALLOY_PORT:-12345}:12345"
      - "[::1]:${DAFNE_ALLOY_PORT:-12345}:12345"
    depends_on:
      otel:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db:
  redis:
